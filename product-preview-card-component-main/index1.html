<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">

   <title>Product preview card component</title>
</head>
<body>
    <div class="card">
        <img src="./images/image-product-desktop.jpg" class="image">

<div class="content">
    <span>PERFUME</span>
    <h1> Gabrielle Essence Eau De Parfum</h1>
    <p class="description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.
    </p>

<div class="cost">
    <span class="new"> $149.99</span>
    <span class="old-cost"> $169.99</span>
</div>
   <button type="button"> <img src="./images/icon-cart.svg" width="10px" height="10px">  Add to Cart</button>
  </div>
  </div>
</body>
</html>
